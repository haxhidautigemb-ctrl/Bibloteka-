<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteka e shkollës</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#222;--mu:#6b6b6b;--ac:#2f6f4f;--ac2:#e8f1ec;--bd:#ddd8cc;--rd:#b3402a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d1b;--card:#262725;--tx:#eee;--mu:#a3a39c;--ac:#6fc196;--ac2:#27352d;--bd:#3a3b38;--rd:#ef8a74;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:14px 2px;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,textarea{width:100%;padding:14px;font-size:19px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.item small,.pick small{color:var(--mu);display:block;margin-top:4px;font-size:.85em;font-weight:400}
.b{padding:14px 20px;font-weight:600;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer;white-space:nowrap}
.b.s{background:var(--ac2);color:var(--ac)}
.b.r{background:transparent;color:var(--rd);padding:4px 8px}
.st{font-size:13px;color:var(--mu);margin:6px 0 10px}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.mo>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:400px}
.row{display:flex;gap:8px}.row>*{flex:1}
.hide{display:none}
.big{width:100%;font-size:22px;padding:18px;margin-top:6px}
.pick{border:2px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:6px;background:var(--card);cursor:pointer}
.pick:active{background:var(--ac2)}
.sel{border-color:var(--ac);background:var(--ac2)}
.ok{background:var(--ac2);color:var(--ac);border-radius:10px;padding:14px;font-weight:600;margin-bottom:12px}
label.l{display:block;font-weight:600;margin:6px 0 4px}
@media print{.tabs,.noprint,.b,#st,input{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="w">
<h1>📚 Biblioteka e shkollës</h1>
<div class="row noprint" style="margin-bottom:12px"><button class="b" id="gx">⬇ Excel</button><button class="b" id="gp">📄 PDF</button><button class="b" id="gl">🔗 Linku</button></div>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<div class="st" id="st"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
var F={em:'',mb:'',kl:'',dt:''};
function grab(){if($('em')){F.em=$('em').value;F.mb=$('mb').value;F.kl=$('kl').value;F.dt=$('dt').value}}
var books=[],loans=[],tab='huazo',selId='',msg='',q='',db=null,mode='local';
var KEY='biblioteka_v1';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(t){if(!t)return'';var d=new Date(t),p=function(n){return(n<10?'0':'')+n};return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function dl(n,c,t){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function report(){
  var out=books.filter(function(b){return b.status==='out'}).sort(function(a,b){return a.out-b.out});
  var t='Raport i bibliotekës - '+fmtD(Date.now())+'\nGjithsej libra: '+cnt(books)+'\nNë raft: '+(cnt(books)-out.length)+'\nTë huazuara: '+out.length+'\n';
  if(out.length){t+='\nLibrat e huazuara:\n';out.forEach(function(b,i){t+=(i+1)+'. '+b.title+' - '+b.student+' ('+b.cls+'), marrë më '+fmtD(b.out)+'\n'})}
  return t;
}
function copyTxt(t){
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');alert('Raporti u kopjua. Tani mund ta ngjitësh (Paste) në email, Viber ose WhatsApp.')}catch(e){alert('Nuk u kopjua. Përdor butonin Excel.')}a.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){alert('Raporti u kopjua. Tani mund ta ngjitësh (Paste) në email, Viber ose WhatsApp.')},fb);else fb();
}
function fmtD(t){return fmt(t).split(' ')[0]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function cnt(a){return a.reduce(function(t,x){return t+(x.n||1)},0)}
function cp(b){return b.n>1?' · '+b.n+' kopje':''}
function take(b){if(b.n>1){b.n--;put('books',b);return{id:uid(),title:b.title,author:b.author,status:'in',n:1}}return b}
/* ---------- ruajtja ---------- */
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({books:books,loans:loans}))}catch(e){}}
function loadLocal(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){books=d.books||[];loans=d.loans||[]}}catch(e){}}
function put(coll,obj){
  var arr=coll==='books'?books:loans,i=arr.findIndex(function(x){return x.id===obj.id});
  if(i>=0)arr[i]=obj;else arr.push(obj);
  if(mode==='db'){var o={};for(var k in obj)if(k!=='id')o[k]=obj[k];db.collection(coll).doc(obj.id).set(o).catch(function(e){$('st').textContent='Gabim në ruajtje: '+(e&&e.message||e)})}
  else saveLocal();
  render();
}
function del(coll,id){
  if(coll==='books')books=books.filter(function(x){return x.id!==id});else loans=loans.filter(function(x){return x.id!==id});
  if(mode==='db')db.collection(coll).doc(id).delete().catch(function(){});else saveLocal();
  render();
}

/* ---------- veprimet ---------- */
function addBooks(text){
  text.split('\n').forEach(function(l){
    l=l.trim();if(!l)return;
    var p=l.split(/\s+[-–;|]\s+/);
    put('books',{id:uid(),title:p[0].trim(),author:(p[1]||'').trim(),status:'in'});
  });
}
function today(){var d=new Date(),p=function(n){return(n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function borrow(id){
  var b=books.find(function(x){return x.id===id});
  var m=document.createElement('div');m.className='mo';
  m.innerHTML='<div><b>Huazo: '+esc(b.title)+'</b><p class="st" id="er" style="color:var(--rd);min-height:1.2em"></p><div class="row"><input id="em" placeholder="Emri"><input id="mb" placeholder="Mbiemri"></div><input id="kl" placeholder="Klasa (p.sh. 4-B)"><label class="st">Data kur është marrë libri</label><input id="dt" type="date" value="'+today()+'"><div class="row"><button class="b s" id="no">Anulo</button><button class="b" id="po">Huazo</button></div></div>';
  document.body.appendChild(m);$('em').focus();
  $('no').onclick=function(){m.remove()};
  $('po').onclick=function(){
    var e=$('em').value.trim(),mb=$('mb').value.trim(),k=$('kl').value.trim(),dv=$('dt').value;
    var miss=!e?'em':!mb?'mb':!k?'kl':!dv?'dt':'';if(miss){$('er').textContent='Plotëso të gjitha fushat: emri, mbiemri, klasa dhe data.';$(miss).focus();$(miss).style.borderColor='var(--rd)';return}
    var t=dv===today()?Date.now():new Date(dv+'T12:00:00').getTime();
    b=take(b);b.status='out';b.student=e+' '+mb;b.cls=k;b.out=t;
    put('books',b);
    put('loans',{id:uid(),bookId:b.id,title:b.title,student:b.student,cls:k,out:t,inn:null});
    m.remove();
  };
}
function giveBack(id){
  var b=books.find(function(x){return x.id===id});
  var l=loans.filter(function(x){return x.bookId===id&&!x.inn}).pop();
  if(l){l.inn=Date.now();put('loans',l)}
  b.status='in';b.student='';b.cls='';b.out=null;
  var tw=books.find(function(x){return x.id!==b.id&&x.status!=='out'&&x.title===b.title&&x.author===b.author});
  if(tw){tw.n=(tw.n||1)+1;put('books',tw);del('books',b.id)}else put('books',b);
}

/* ---------- pamja ---------- */
function match(s){return !q||s.toLowerCase().indexOf(q.toLowerCase())>=0}
function stockFile(){
  var m={},k=[],ou=0;books.forEach(function(b){var key=b.title+'|'+b.author;if(!m[key]){m[key]={t:b.title,a:b.author,i:0,o:0};k.push(key)}if(b.status==='out'){m[key].o++;ou++}else m[key].i+=(b.n||1)});
  k.sort(function(x,y){return m[x].t.localeCompare(m[y].t,'sq')||m[x].a.localeCompare(m[y].a,'sq')});
  var r=[['Gjendja e stokut',fmtD(Date.now())],['Gjithsej kopje',cnt(books)],['Në raft',cnt(books)-ou],['Të huazuara',ou],[],['Nr.','Titulli','Autori','Gjithsej kopje','Në raft','Të huazuara']];
  k.forEach(function(x,i){var e=m[x];r.push([i+1,e.t,e.a,e.i+e.o,e.i,e.o])});
  return '\ufeff'+r.map(function(a){return a.map(function(c){return'"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n')}
function stockData(){
  var m={},k=[],ou=0;books.forEach(function(b){var key=b.title+'|'+b.author;if(!m[key]){m[key]={t:b.title,a:b.author,i:0,o:0};k.push(key)}if(b.status==='out'){m[key].o++;ou++}else m[key].i+=(b.n||1)});
  k.sort(function(x,y){return m[x].t.localeCompare(m[y].t,'sq')||m[x].a.localeCompare(m[y].a,'sq')});
  return{ou:ou,rows:k.map(function(x,i){var e=m[x];return[i+1,e.t,e.a,e.i+e.o,e.i,e.o]})}}
function sendFile(f,n,mime){
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Gjendja e librave'}).catch(function(){});return}}catch(e){}
  dl(n,f,mime)}
$('gp').onclick=function(){
  var J=window.jspdf;if(!J||!J.jsPDF){alert('PDF-ja kërkon internet. Lidhu dhe provo sërish.');return}
  var s=stockData(),n='stoku-'+today()+'.pdf',d=new J.jsPDF();
  d.setFontSize(14);d.text('Gjendja e librave - Biblioteka e shkollës',14,14);
  d.setFontSize(10);d.text(fmtD(Date.now())+'   |   Gjithsej kopje: '+cnt(books)+'   |   Në raft: '+(cnt(books)-s.ou)+'   |   Të huazuara: '+s.ou,14,21);
  d.autoTable({startY:26,head:[['Nr.','Titulli','Autori','Gjithsej','Në raft','Të huazuara']],body:s.rows,styles:{fontSize:8,cellPadding:1.5},headStyles:{fillColor:[48,84,150]},columnStyles:{0:{cellWidth:10},3:{cellWidth:16},4:{cellWidth:14},5:{cellWidth:20}}});
  var b=d.output('blob');
  try{var f=new File([b],n,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Gjendja e librave'}).catch(function(){});return}}catch(e){}
  d.save(n)};
$('gl').onclick=function(){var u='https://claude.ai/artifact/BStfQqKKETaqfg7WmaRJMK',t='Biblioteka e shkollës';
  if(navigator.share){navigator.share({title:t,text:t,url:u}).catch(function(){});return}
  try{navigator.clipboard.writeText(u).then(function(){alert('Linku u kopjua. Ngjite ku do ta dërgosh.')},function(){prompt('Kopjo linkun:',u)})}catch(e){prompt('Kopjo linkun:',u)}};
$('gx').onclick=function(){
  var n='stoku-'+today()+'.csv',t=stockFile();
  try{var f=new File([t],n,{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Gjendja e librave'}).catch(function(){});return}}catch(e){}
  dl(n,t,'text/csv')};
function render(){
  var out=books.filter(function(b){return b.status==='out'}),inn=books.filter(function(b){return b.status!=='out'});
  var T=[['huazo','📖 Huazo'],['huazuar','📋 Të huazuara ('+out.length+')'],['hist','🕘 Historiku'],['shto','📚 Librat ('+cnt(inn)+')']];
  $('tabs').innerHTML=T.map(function(t){return'<button class="'+(tab===t[0]?'on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
  Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){tab=b.dataset.t;q='';msg='';render()}});
  var h='';
  if(tab==='lira'||tab==='huazuar'||tab==='hist')h+='<input id="sr" placeholder="🔍 Kërko..." value="'+esc(q)+'">';
  if(tab==='huazo'){
    var av=inn.filter(function(b){return match(b.title+' '+b.author)}).sort(function(a,b){return a.title.localeCompare(b.title)});
    var sb=books.find(function(b){return b.id===selId&&b.status!=='out'});
    h+=(msg?'<div class="ok">'+msg+'</div>':'');
    h+='<label class="l">1. Emri</label><input id="em" value="'+esc(F.em)+'" autocomplete="off"><label class="l">2. Mbiemri</label><input id="mb" value="'+esc(F.mb)+'" autocomplete="off"><label class="l">3. Klasa</label><input id="kl" value="'+esc(F.kl)+'" placeholder="p.sh. 4-B" autocomplete="off"><label class="l">4. Data kur e merr librin</label><input id="dt" type="date" value="'+(F.dt||today())+'">';
    h+='<label class="l">5. Libri</label>';
    if(sb)h+='<div class="pick sel"><b>✔ '+esc(sb.title)+'</b><small>'+esc(sb.author)+'</small><br><a href="#" id="chg" style="color:var(--ac)">Zgjidh tjetër libër</a></div>';
    else{h+='<input id="sr" placeholder="🔍 Shkruaj titullin e librit..." value="'+esc(q)+'" autocomplete="off">';
      h+=(av.slice(0,8).map(function(b){return'<div class="pick" data-a="pk" data-id="'+b.id+'"><b>'+esc(b.title)+'</b><small>'+esc(b.author)+'</small></div>'}).join('')||'<p class="st">Nuk u gjet asnjë libër i lirë me këtë emër.</p>');
      if(av.length>8)h+='<p class="st">Shkruaj më shumë shkronja për të gjetur librin...</p>';}
    h+='<div id="er" style="color:var(--rd);font-weight:600;min-height:1.4em"></div><button class="b big" id="sv">✅ RUAJ</button>';
  }else if(tab==='lira'){
    var l=inn.filter(function(b){return match(b.title+' '+b.author)}).sort(function(a,b){return a.title.localeCompare(b.title)});
    h+=l.map(function(b){return'<div class="item"><div><b>'+esc(b.title)+'</b><small>'+esc(b.author)+'</small></div><button class="b" data-a="bo" data-id="'+b.id+'">Huazo</button></div>'}).join('')||'<p class="st">Nuk ka libra. Shtoji te "+ Shto".</p>';
  }else if(tab==='huazuar'){
    h+='<div class="item" style="display:block"><b>Gjendja e bibliotekës</b><br>Gjithsej libra: <b>'+cnt(books)+'</b><br>Në raft: <b>'+cnt(inn)+'</b><br>Të huazuara: <b>'+out.length+'</b><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap" class="noprint"><button class="b" id="rcp">📋 Kopjo raportin</button><button class="b s" id="rxl">⬇ Excel (librat e huazuar)</button><button class="b s" id="rst">📊 Excel: gjendja e stokut</button><button class="b s" id="rpr">🖨 Printo / PDF</button></div></div>';
    var l2=out.filter(function(b){return match(b.title+' '+b.student)}).sort(function(a,b){return a.out-b.out});
    h+=l2.map(function(b){return'<div class="item"><div><b>'+esc(b.title)+'</b><small>'+esc(b.student)+(b.cls?' · '+esc(b.cls):'')+' · marrë më '+fmtD(b.out)+'</small></div><button class="b" data-a="rt" data-id="'+b.id+'">Kthe</button></div>'}).join('')||'<p class="st">Asnjë libër nuk është i huazuar.</p>';
  }else if(tab==='hist'){
    var l3=loans.filter(function(x){return match(x.title+' '+x.student)}).sort(function(a,b){return b.out-a.out});
    h+=l3.map(function(x){return'<div class="item"><div><b>'+esc(x.title)+'</b><small>'+esc(x.student)+(x.cls?' · '+esc(x.cls):'')+'<br>Marrë: '+fmtD(x.out)+'<br>'+(x.inn?'Kthyer: '+fmt(x.inn):'<span style="color:var(--rd)">Ende i pakthyer</span>')+'</small></div></div>'}).join('')||'<p class="st">Ende pa huazime.</p>';
  }else if(false){
    h+='<p><b>Ruaj një kopje</b></p><p class="st">Shkarko skedarin me të gjithë librat dhe huazimet. Ruaje në USB ose dërgoje në email/telefon. Bëje këtë sa herë ndryshon diçka të rëndësishme.</p><button class="b" id="bk">⬇ Shkarko kopjen</button>'+
    '<p style="margin-top:24px"><b>Rikthe nga një kopje</b></p><p class="st">Zgjidh skedarin e kopjes që ke shkarkuar më parë. Kjo i zëvendëson të dhënat aktuale.</p><input type="file" id="rf" accept=".json">'+
    '<p style="margin-top:24px"><b>Lista e huazimeve për Excel</b></p><button class="b s" id="cv">⬇ Shkarko për Excel (CSV)</button>';
  }else{
    h+='<p><b>Shto një libër</b></p><input id="nt" placeholder="Titulli"><input id="na" placeholder="Autori (opsionale)"><button class="b" id="ab">Shto</button>'+
    '<p style="margin-top:24px"><b>Shto shumë libra njëherësh</b></p><p class="st">Ngjit listën, një libër për rresht. Nëse dëshiron autorin, shkruaje pas një vizë: <i>Titulli - Autori</i></p><textarea id="bl" rows="8"></textarea><button class="b" id="ab2">Shto listën</button>'+
    '<p style="margin-top:24px"><b>💾 Kopje (rezervë)</b></p><p class="st">Shkarko një kopje të librave dhe huazimeve. Ruaje në USB ose dërgoje në email.</p><button class="b" id="bk">⬇ Shkarko kopjen</button> <button class="b s" id="cv">⬇ Excel</button><p class="st" style="margin-top:12px">Rikthe nga kopja:</p><input type="file" id="rf" accept=".json">'+'<p style="margin-top:24px"><b>Fshij libër</b></p>'+books.slice().sort(function(a,b){return a.title.localeCompare(b.title)}).map(function(b){return'<div class="item"><div>'+esc(b.title)+'<small>'+esc(b.author)+'</small></div><button class="b r" data-a="dl" data-id="'+b.id+'">Fshij</button></div>'}).join('');
  }
  $('app').innerHTML=h;
  var sr=$('sr');if(sr){sr.oninput=function(){grab();q=sr.value;var p=sr.selectionStart;render();var n=$('sr');n.focus();n.setSelectionRange(p,p)}}
  Array.prototype.forEach.call($('app').querySelectorAll('[data-a]'),function(b){b.onclick=function(){
    var a=b.dataset.a,id=b.dataset.id;
    if(a==='pk'){grab();selId=id;render();}else if(a==='bo')borrow(id);else if(a==='rt')giveBack(id);else if(a==='dl'&&confirm('Ta fshij këtë libër?'))del('books',id);
  }});
  if($('rcp'))$('rcp').onclick=function(){copyTxt(report())};
  if($('rpr'))$('rpr').onclick=function(){window.print()};
  if($('rst'))$('rst').onclick=function(){dl('stoku-'+today()+'.csv',stockFile(),'text/csv')};
  if($('rxl'))$('rxl').onclick=function(){
    var o=books.filter(function(b){return b.status==='out'}).sort(function(a,b){return a.out-b.out});
    var r=[['Raport i bibliotekës',fmtD(Date.now())],['Gjithsej libra',cnt(books)],['Në raft',cnt(books)-o.length],['Të huazuara',o.length],[],['Libri','Emri dhe mbiemri','Klasa','Data e marrjes']].concat(o.map(function(b){return[b.title,b.student,b.cls,fmtD(b.out)]}));
    dl('raport-'+today()+'.csv','\ufeff'+r.map(function(a){return a.map(function(c){return'"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n'),'text/csv')};
  if($('chg'))$('chg').onclick=function(e){e.preventDefault();grab();selId='';q='';render()};
  if($('sv'))$('sv').onclick=function(){
    grab();var er=$('er'),b=books.find(function(x){return x.id===selId&&x.status!=='out'});
    var miss=!F.em.trim()?'em':!F.mb.trim()?'mb':!F.kl.trim()?'kl':!F.dt?'dt':'';
